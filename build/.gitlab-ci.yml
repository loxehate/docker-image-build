include:
  - component: $CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@4
    inputs:
      commit-spec: conventionalcommits

  - component: $CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@8.4
    inputs:
      trivy-disabled: true
      release-extra-tags: "latest \\g<major>.\\g<minor>\\g<build>"

semantic-release:
  allow_failure: true

test-docker-smoke:
  stage: package-test
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    SMOKE_IMAGE: $CI_REGISTRY_IMAGE/snapshot:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker run --rm --entrypoint soffice $SMOKE_IMAGE --version
    - docker run --rm --entrypoint python3 $SMOKE_IMAGE -c "import uno; print('uno import OK')"
