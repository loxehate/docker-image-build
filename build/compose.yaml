services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    image: slides-to-images:local
    init: true
    restart: "no"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /data/program/slides-to-images
        target: /data/program/slides-to-images
    working_dir: /app
