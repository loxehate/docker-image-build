services:
  impress-image:
    build:
      context: ./docker-libreoffice-impress-main
      dockerfile: Dockerfile
      network: host
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    image: slides2images-libreoffice-impress:local
    entrypoint: ["/bin/true"]
    restart: "no"

  converter:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: slides-to-images:local
    init: true
    restart: "no"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      SLIDES2IMAGES_IMPRESS_IMAGE: slides2images-libreoffice-impress:local
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /data/program/slides-to-images
        target: /data/program/slides-to-images
    working_dir: /app
