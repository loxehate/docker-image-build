[project]
name = "slides-to-images"
dynamic = ["version"]
description = "Converts a PowerPoint deck into an animation-playback video and per-slide static images."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pierre Gronlier", email = "pierre@gronlier.fr" },
]
keywords = [
    "powerpoint",
    "pptx",
    "presentation",
    "slides",
    "animation",
    "video",
    "libreoffice",
    "impress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "lxml==6.1.1",
    "python-pptx==1.0.2",
]

[project.urls]
Homepage = "https://gitlab.com/riphixel/slides-to-images"
Repository = "https://gitlab.com/riphixel/slides-to-images"
Issues = "https://gitlab.com/riphixel/slides-to-images/-/issues"

[dependency-groups]
test = [
    "docker==7.2.0",
    "pillow==12.3.0",
    "pytest==9.1.1",
    "testcontainers==4.14.2",
]
dev = [
    "mypy==2.3.0",
    "basedpyright==1.39.9",
    "ruff==0.16.0",  # kept in sync with the version CI's python component pip-installs unpinned
]

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"
default-version = "0.0.0-dev"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slides2images"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["lxml.*", "testcontainers.*"]
ignore_missing_imports = true  # no stub packages published for either; no network access here to add lxml-stubs/types-testcontainers if they exist

[tool.pyright]
exclude = ["**/.venv", "**/__pycache__", "**/*.egg-info", "build/", "dist/", ".cache/"]
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "information"
reportUnknownVariableType = "information"
reportUnknownArgumentType = "information"

# reportUnknownParameterType = false
# reportUnusedCallResult = false  # this codebase idiomatically discards subprocess.run(check=True)/add_argument()'s return value
# reportImplicitStringConcatenation = false  # used deliberately for multi-line f-string/error messages throughout

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["F401"]